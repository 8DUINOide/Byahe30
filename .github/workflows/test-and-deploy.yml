name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main'
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "$deploy_url" ]; then
            echo "::notice::Set the RENDER_DEPLOY_HOOK_URL repository secret to enable deployment."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null "$deploy_url&ref=$GITHUB_SHA"
          echo "Render deploy requested."
